[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textcharts"
version = "0.1.0"
description = "Beautiful ASCII charts for your terminal — bar, histogram, heatmap, box plot, and 11 more chart types with zero dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Joe Harris", email = "joe@benchbox.dev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["ascii", "chart", "terminal", "visualization", "bar chart", "histogram", "heatmap"]

[project.urls]
Homepage = "https://github.com/benchbox-dev/textcharts"
Documentation = "https://github.com/benchbox-dev/textcharts#readme"
Repository = "https://github.com/benchbox-dev/textcharts"
Issues = "https://github.com/benchbox-dev/textcharts/issues"

[dependency-groups]
dev = [
    "ansi2html>=1.9",
    "pillow>=11.0",
    "pytest>=7.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "sphinx>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/textcharts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
