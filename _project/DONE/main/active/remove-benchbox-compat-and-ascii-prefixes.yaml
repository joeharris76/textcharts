must_preserve:
  - "All chart rendering output is byte-identical before and after rename"
  - "MCP server and CLI continue to work (registry resolution via getattr)"
  - "README.md Provenance section and BenchBox GitHub link are untouched"
  - "pyproject.toml benchbox.dev email and URLs are untouched"
  - "All new generic factory functions (from_data, from_series, etc.) continue to work"

approach: |
  Use a phased approach with temporary backward-compat aliases:

  Phase 1 (w1): Rename class defs, add ASCIIFoo = Foo aliases at module bottom.
  This keeps all existing consumers working while the rename propagates.

  Phase 2 (w2-w6): Update all consumers (registry, __init__, tests, scripts,
  deprecated factory removal). Each work unit can be verified independently
  because the temp aliases keep old names working.

  Phase 3 (w7): Remove temp aliases and update docs. At this point no consumer
  references the old names, so removal is safe.

anti_patterns:
  - "DO NOT remove temp aliases before all consumers are updated — because tests
    and scripts will break — update consumers first in w2-w6, then remove in w7"
  - "DO NOT modify README.md Provenance section — because user explicitly wants
    to keep it — leave it untouched"
  - "DO NOT rename data models (BarData, LinePoint, etc.) — because they already
    have clean names — only rename ASCII*-prefixed classes"

verification:
  - description: "Full test suite passes after each work unit"
    command: "uv run python -m pytest tests/ -x -q"
    expected_output: "all tests pass"
  - description: "Linter passes"
    command: "uv run ruff check src/ tests/"
    expected_output: "no errors"
  - description: "Docs build without warnings"
    command: "uv run --group dev sphinx-build -W -b html docs docs/_build/html"
    expected_output: "build succeeds"
  - description: "No ASCII* names remain in __init__.py exports"
    command: "grep 'ASCII' src/textcharts/__init__.py"
    expected_output: "no output"
  - description: "No deprecated factory names remain in source"
    command: "grep -r 'from_bar_data\\|from_query_latency_data\\|from_distribution_series\\|from_comparison_data\\|from_regression_data\\|from_time_series_points\\|from_cost_performance_points\\|from_normalized_results\\|from_phase_data\\|from_metrics\\|from_heatmap_data' src/"
    expected_output: "no output"
  - description: "MCP server loads correctly"
    command: "uv run python -c 'from textcharts.commands.registry import REGISTRY; print(len(REGISTRY))'"
    expected_output: "15"

