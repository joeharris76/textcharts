impact:
  business_value: |
    Completes the de-BenchBox initiative. The public API uses clean, intuitive names
    throughout. No backward compatibility layer to maintain or explain to new users.
  user_impact: |
    Breaking change for anyone importing ASCII* names or calling deprecated factories.
    All imports must use clean names (BarChart, ChartOptions, etc.).
  technical_debt: |
    Eliminates the dual-naming layer (ASCII* internal + clean aliases), deprecated
    factory wrappers, migration docs, and dead CSS. Simplifies __init__.py from
    207 lines of exports to ~80.

