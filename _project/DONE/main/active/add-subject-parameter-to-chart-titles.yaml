must_preserve:
  - "All existing callers that omit subject see identical output (pure additive API change)"
  - "Explicit title parameter always wins over subject composition"
  - "uv run python -m pytest tests/ passes after golden snapshot regeneration"

approach: |
  Follow the subtitle pattern: add to base class __init__, thread through each
  chart constructor, executor, and MCP server. Title composition is a simple
  f-string prefix in a base class helper method, keeping each chart's
  constructor change to a one-liner.

anti_patterns:
  - "DO NOT change the title parameter behavior — because existing callers pass explicit titles — subject is additive only"
  - "DO NOT put composition logic in each chart — because that duplicates logic — centralize in ASCIIChartBase"
  - "DO NOT make subject affect subtitle — because subtitle is an independent display line — subject only modifies the title"

verification:
  - description: "Full test suite passes"
    command: "uv run python -m pytest tests/ -x -q"
    expected_output: "all tests pass"
  - description: "Subject composes with default title"
    command: "uv run python -c \"from textcharts.histogram import ASCIIQueryHistogram, HistogramBar; h = ASCIIQueryHistogram([HistogramBar('q1', 10)], subject='Query Latency'); print(h.title)\""
    expected_output: "Query Latency Histogram"
  - description: "Explicit title wins over subject"
    command: "uv run python -c \"from textcharts.histogram import ASCIIQueryHistogram, HistogramBar; h = ASCIIQueryHistogram([HistogramBar('q1', 10)], title='Custom', subject='Ignored'); print(h.title)\""
    expected_output: "Custom"

scope_limit:
