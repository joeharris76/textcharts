id: generalize-benchbox-field-names
title: "Generalize BenchBox-specific field names across all chart types"
worktree: dev-012
priority: High
status: Completed
completed_date: "2026-03-10"
category: Core Functionality
description: |
  The MCP server tool schemas and CLI parameters use BenchBox-specific field names
  (e.g., query_id, latency_ms, geo_mean_ms, platforms). When LLMs use these tools
  for non-benchmark data, they're forced into benchmark terminology. Example: creating
  a "commits per day" histogram, the LLM used query_id and latency_ms instead of
  meaningful field names like "date" and "count".

  This is a BREAKING CHANGE to the public API, acceptable at v0.1.2-dev (pre-1.0).

  The CLI is 100% registry-driven (cli.py dynamically generates argparse from
  registry.py), so all registry changes automatically propagate to both MCP tool
  schemas AND CLI --flags. No separate CLI parameter definitions exist.

  Rename map:
    Histogram: query_id->label, latency_ms->value, sort_by enum query_id/latency->label/value
    Summary:   geo_mean_ms->primary_value, median_ms->secondary_value, total_time_ms->total_value,
               geo_mean_baseline_ms->primary_baseline, geo_mean_comparison_ms->primary_comparison,
               total_time_baseline_ms->total_baseline, total_time_comparison_ms->total_comparison,
               num_queries->num_items, best_queries->best_items, worst_queries->worst_items
    Rank:      queries->items, platforms->groups, times->values, tuple (platform,query)->(group,item)
    Sparkline: platforms->rows
    Scatter:   remove "# Cost"/"# Performance" comments, remove cost/performance getattr fallbacks
    Registry defaults: scatter x/y "Cost (USD)"/"Performance"->"X"/"Y",
               comparison metric_label "Execution Time (ms)"->"Value",
               heatmap/stacked/percentile "ms"->"", summary title "Benchmark Summary"->"Summary"

work:
  - id: w1
    summary: "Rename histogram HistogramBar fields: query_id->label, latency_ms->value"
    status: done
    notes: |
      Files: src/textcharts/histogram.py (~30 locations),
             src/textcharts/commands/registry.py (histogram entry),
             src/textcharts/commands/parsers.py (parse_histogram)

      Dataclass: HistogramBar.query_id -> label, .latency_ms -> value
      Constructor: sort_by default "query_id" -> "label", comparison == "latency" -> == "value"
      Hardcoded: "Query ID" x-axis labels (lines 338, 564) -> "" (empty)
      Factory: from_data() getattr calls
      Method: _compact_query_label -> _compact_label
      Registry: histogram entry fields, sort_by enum ["query_id","latency"] -> ["label","value"],
                description "query latency" -> "frequency distribution",
                y_label default "Execution Time (ms)" -> "Value"
      Parser: parse_histogram() required keys + field access

  - id: w2
    summary: "Rename SummaryStats dataclass fields from benchmark-specific to generic"
    status: done
    notes: |
      Files: src/textcharts/summary_box.py (dataclass + ~20 field references),
             src/textcharts/commands/registry.py (summary entry),
             src/textcharts/commands/parsers.py (parse_summary)

      Field renames in SummaryStats dataclass and all self.stats.FIELD_NAME references:
        geo_mean_ms -> primary_value, median_ms -> secondary_value,
        total_time_ms -> total_value,
        geo_mean_baseline_ms -> primary_baseline,
        geo_mean_comparison_ms -> primary_comparison,
        total_time_baseline_ms -> total_baseline,
        total_time_comparison_ms -> total_comparison,
        num_queries -> num_items,
        best_queries -> best_items, worst_queries -> worst_items
      Update is_comparison property (checks primary_baseline/total_baseline)
      Registry: summary title default "Benchmark Summary" -> "Summary", all field names
      Parser: parse_summary() float_fields, int_fields, field access

  - id: w3
    summary: "Add configurable rendered labels to SummaryStats, replace hardcoded strings"
    needs: [w2]
    status: done
    notes: |
      Files: src/textcharts/summary_box.py (rendering methods only),
             src/textcharts/commands/registry.py (add new data fields)

      Add new fields to SummaryStats:
        primary_label: str = "Primary"    (replaces hardcoded "Geo Mean:")
        secondary_label: str = "Secondary" (replaces hardcoded "Median:")
        total_label: str = "Total"         (keeps existing label)
        count_label: str = "Items"         (replaces hardcoded "Queries:")

      Update rendering methods to use self.stats.*_label:
        _render_comparison_metrics (lines 370, 386, 394)
        _render_single_metrics (lines 410, 415, 420, 425)
        _build_metric_texts_single (lines 435, 437, 439, 441)
        _build_metric_texts_comparison (lines 453, 462, 464)

  - id: w4
    summary: "Rename RankTableData fields: queries->items, platforms->groups, times->values"
    status: done
    notes: |
      Files: src/textcharts/rank_table.py (~15 locations),
             src/textcharts/commands/registry.py (rank entry),
             src/textcharts/commands/parsers.py (parse_rank)

      Dataclass: queries->items, platforms->groups, times->values
      Tuple key: (platform, query) -> (group, item) throughout
      Factory: from_matrix() param names queries->items, platforms->groups
      Parser: key format error "platform,query" -> "group,item"
      Column header: "Query" -> "Item" (line 121)

  - id: w5
    summary: "Rename SparklineTableData.platforms -> rows"
    status: done
    notes: |
      Files: src/textcharts/sparkline_table.py (~8 locations),
             src/textcharts/commands/registry.py (sparkline entry),
             src/textcharts/commands/parsers.py (parse_sparkline)

      Dataclass: platforms -> rows
      Factory: from_data() param rename platforms->rows
      SparklineColumn.values dict keys are dynamic (no rename needed)

  - id: w6
    summary: "Clean up scatter plot + fix all remaining registry defaults"
    status: done
    notes: |
      Files: src/textcharts/scatter_plot.py (5 locations),
             src/textcharts/commands/registry.py (scatter, comparison, heatmap, stacked, percentile entries)

      Scatter: remove "# Cost"/"# Performance" comments from ScatterPoint,
               remove getattr fallbacks for "cost"/"performance" in from_points()
      Registry defaults to fix:
        scatter x_label "Cost (USD)" -> "X", y_label "Performance" -> "Y"
        scatter description "cost vs. performance" -> "X/Y relationship"
        comparison metric_label "Execution Time (ms)" -> "Value"
        heatmap value_label "ms" -> ""
        stacked metric_label "ms" -> ""
        percentile metric_label "ms" -> ""

  - id: w7
    summary: "Update documentation (input-formats.md, base.py docstring)"
    needs: [w1, w3, w4, w5, w6]
    status: done
    notes: |
      Files: docs/input-formats.md (histogram, summary, rank, sparkline sections),
             src/textcharts/base.py (1 docstring referencing "Query ID")

      input-formats.md: update field tables, JSON examples, chart_params for each
      renamed chart type. Update sort_by enum values in histogram section.

  - id: w8
    summary: "Update histogram test files"
    needs: [w1]
    status: done
    notes: |
      All HistogramBar(query_id=..., latency_ms=...) -> HistogramBar(label=..., value=...)
      All sort_by="query_id" -> sort_by="label"

      Files:
