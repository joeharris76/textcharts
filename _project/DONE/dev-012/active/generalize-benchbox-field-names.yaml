must_preserve:
  - "Histogram.render() produces identical bar output with HistogramBar(label=x, value=y) as old HistogramBar(query_id=x, latency_ms=y) — only the x-axis 'Query ID' label is removed"
  - "SummaryBox.render() produces identical box layout; only rendered metric labels change from hardcoded 'Geo Mean:'/'Median:'/'Queries:' to configurable label fields"
  - "RankTable.render() produces identical ranking table with new field names"
  - "SparklineTable.render() produces identical sparkline output with rows= instead of platforms="
  - "CLI --help for all 15 commands still works correctly (generated from registry)"
  - "MCP server tool schemas remain valid JSON Schema via get_input_schema()"

approach: |
  Use systematic find-and-replace per chart type, working from dataclass -> parser ->
  registry -> tests. The registry is the single source of truth for both CLI and MCP.

  w1, w2, w4, w5, w6 are independent (different chart types, different sections of
  registry.py and parsers.py). Execute in any order. w3 depends on w2. w7-w11 depend
  on source renames completing first. w12 is final verification.

  For summary box, split into two steps: w2 renames fields, w3 adds label fields and
  updates rendering. This keeps the field rename mechanical and the label addition clean.

  Use targeted per-file replaces, not global codebase search-replace, because field
  names like 'value' and 'label' are common words.

anti_patterns:
  - "DO NOT use global text replace across the whole codebase -- because field names like 'value' and 'label' are common words -- do targeted replaces per file instead"
  - "DO NOT try to keep tests passing at intermediate steps -- because the renames are deeply interconnected across registry+parser+dataclass -- update all three together per chart type, then fix tests"
  - "DO NOT rename CLI flag names like --sort-by or --y-label -- because these are already generic -- only change their default values and enum choices"

verification:
  - description: "No old BenchBox field names remain in source"
    command: "rg 'query_id|latency_ms|geo_mean_ms|median_ms|total_time_ms|num_queries|best_queries|worst_queries' src/textcharts/"
    expected_output: "No matches found (exit code 1)"
  - description: "Full test suite passes"
    command: "uv run pytest tests/ -x -q"
    expected_output: "All tests pass, 0 failures"
  - description: "MCP histogram schema uses generic field names"
    command: "uv run python -c \"from textcharts.commands.registry import get_input_schema; import json; s=get_input_schema('histogram'); fields=list(s['properties']['data']['items']['properties'].keys()); print(fields); assert 'label' in fields and 'value' in fields and 'query_id' not in fields\""
    expected_output: "Prints field list containing 'label' and 'value'"
  - description: "MCP summary schema uses generic field names"
    command: "uv run python -c \"from textcharts.commands.registry import get_input_schema; import json; s=get_input_schema('summary'); fields=list(s['properties']['data']['properties'].keys()); print(fields); assert 'primary_value' in fields and 'geo_mean_ms' not in fields\""
    expected_output: "Prints field list containing 'primary_value', not 'geo_mean_ms'"
  - description: "MCP rank schema uses generic field names"
    command: "uv run python -c \"from textcharts.commands.registry import get_input_schema; import json; s=get_input_schema('rank'); fields=list(s['properties']['data']['properties'].keys()); print(fields); assert 'items' in fields and 'queries' not in fields\""
    expected_output: "Prints field list containing 'items' and 'groups', not 'queries' and 'platforms'"
  - description: "MCP sparkline schema uses generic field names"
    command: "uv run python -c \"from textcharts.commands.registry import get_input_schema; import json; s=get_input_schema('sparkline'); fields=list(s['properties']['data']['properties'].keys()); print(fields); assert 'rows' in fields and 'platforms' not in fields\""
    expected_output: "Prints field list containing 'rows', not 'platforms'"
  - description: "CLI histogram renders with generic data"
    command: "echo '[{\"label\": \"Mon\", \"value\": 3}, {\"label\": \"Tue\", \"value\": 6}]' | uv run textcharts histogram --title 'Test' --no-color"
    expected_output: "Renders a histogram with Mon/Tue labels"

