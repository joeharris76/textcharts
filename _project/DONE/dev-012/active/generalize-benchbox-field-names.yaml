        tests/test_rendering_modes.py (histogram data helper)
        tests/test_edge_cases.py (histogram zero-latency test)
        tests/test_outlier_regression.py (~15 locations)
        tests/test_factory_functions.py (test_histogram_from_data)

  - id: w9
    summary: "Update summary box test files"
    needs: [w3]
    status: done
    notes: |
      All SummaryStats field renames: geo_mean_ms->primary_value, etc.
      All num_queries->num_items, best_queries->best_items, worst_queries->worst_items

      Files:
        tests/test_summary_box.py (~45 locations across 15+ test functions)
        tests/test_edge_cases_and_features.py (summary + "Benchmark Summary" assertion)

  - id: w10
    summary: "Update rank table and sparkline test files"
    needs: [w4, w5]
    status: done
    notes: |
      Rank: RankTableData(queries=..., platforms=..., times=...) -> (items=..., groups=..., values=...)
             from_matrix() param renames
      Sparkline: SparklineTableData(platforms=...) -> (rows=...)
                 sparkline_from_data(platforms=...) -> (rows=...)

      Files:
        tests/test_rank_table_behavior.py (~15 locations)
        tests/test_sparkline_table_behavior.py (~6 locations)
        tests/test_factory_functions.py (rank from_matrix + sparkline_from_data)

  - id: w11
    summary: "Update shared SAMPLE_DATA in CLI, commands, MCP, golden, and other test files"
    needs: [w1, w3, w4, w5, w6]
    status: done
    notes: |
      SAMPLE_DATA dicts contain field names for ALL chart types — must update all at once.

      Files:
        tests/test_commands.py - SAMPLE_DATA + parser test assertions (result[0].query_id etc.)
        tests/test_mcp_server.py - SAMPLE_DATA
        tests/test_cli.py - SAMPLE_DATA
        tests/test_golden_output.py - all chart data constructors
        tests/test_chart_rendering.py - histogram + summary data (~35 locations)
        tests/test_edge_cases_and_features.py - scatter "Cost (USD)" assertions
        scripts/generate_doc_screenshots.py - all chart data constructors (~4 functions)

  - id: w12
    summary: "Regenerate golden snapshots and run full verification"
    needs: [w7, w8, w9, w10, w11]
    status: done
    notes: |
      uv run pytest tests/test_golden_output.py --update-golden
      uv run pytest tests/ -x -q
      Verify no old names: rg 'query_id|latency_ms|geo_mean_ms|median_ms|total_time_ms|num_queries|best_queries|worst_queries' src/textcharts/
      Smoke test: echo '[{"label":"Mon","value":3}]' | uv run textcharts histogram

