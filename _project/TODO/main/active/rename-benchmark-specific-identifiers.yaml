id: "rename-benchmark-specific-identifiers"
title: "Rename benchmark-specific factory functions to generic names"
worktree: "main"
priority: "Medium"
status: "Not Started"
description: |
  Factory function names like from_query_latency_data(), from_regression_data(),
  and from_cost_performance_points() use benchmark-domain terminology. Rename to
  generic equivalents (from_data(), from_points(), from_series(), from_ratios())
  and keep old names as deprecated aliases emitting DeprecationWarning.

  Also rename DEFAULT_MAX_QUERIES → DEFAULT_MAX_BARS in histogram.py, and update
  domain-specific parameter names in factory functions (e.g., cost_label →
  x_label in scatter_plot's new from_points()).
category: "Core Functionality"
work:
  - id: w1
    summary: "Create generic factory function names and deprecate old names across all 12 chart files"
    status: pending
    notes: |
      For each file, create the new generic function, then make the old name a
      thin wrapper that calls warnings.warn() + delegates. Update __init__.py
      exports to include both old and new names.

      Renames: histogram from_data, scatter_plot from_points, diverging_bar
      from_data, line_chart from_points, box_plot from_series, stacked_bar
      from_data, rank_table from_matrix, cdf_chart from_series,
      percentile_ladder from_series, normalized_speedup from_ratios,
      bar_chart from_data, comparison_bar from_data.

  - id: w2
    summary: "Rename DEFAULT_MAX_QUERIES → DEFAULT_MAX_BARS and update parameter names in new factory functions"
    needs: [w1]
    status: pending
    notes: |
      histogram.py: DEFAULT_MAX_QUERIES → DEFAULT_MAX_BARS.
      scatter_plot from_points: cost_label → x_label, performance_label → y_label.

  - id: w3
    summary: "Update internal textcharts usage to use new names"
    needs: [w1]
    status: pending
    notes: |
      Search for internal calls to old factory names within textcharts (CLI,
      MCP server, commands layer). Update to use new names.

  - id: w4
    summary: "Update docs and examples to use new generic names"
    needs: [w1]
    status: pending
    notes: |
      Update docs/reference/factories.rst, tutorials, and any code examples
      to prefer the new generic names. Document deprecated aliases.

  - id: w5
    summary: "Add tests verifying deprecated aliases emit warnings and still work"
    needs: [w1]
    status: pending
    notes: |
      Test that calling from_query_latency_data() emits DeprecationWarning
      and returns the same result as from_data().
metadata:
  owners:
    - "joe"
  tags:
    - "api"
    - "de-benchbox"
    - "deprecation"
  estimated_effort: "Medium"
  created_date: "2026-03-08"
  last_updated: "2026-03-08T00:00:00"
deps:
  needs:
    - "neutralize-default-labels-and-titles"
impact:
  business_value: |
    Makes the API self-documenting for non-benchmark users. Generic names like
    from_data() are immediately understandable without BenchBox context.
  user_impact: |
    New users see intuitive function names. Existing users get deprecation
    warnings guiding them to the new names at their own pace.
  technical_debt: |
    Clears the last major category of benchmark-specific naming from the
    public API. Once BenchBox updates its call sites, the deprecated aliases
    can be removed in a future major version.
files_affected:
  modified:
    - "src/textcharts/histogram.py"
    - "src/textcharts/scatter_plot.py"
    - "src/textcharts/diverging_bar.py"
    - "src/textcharts/line_chart.py"
    - "src/textcharts/box_plot.py"
    - "src/textcharts/stacked_bar.py"
    - "src/textcharts/rank_table.py"
    - "src/textcharts/cdf_chart.py"
    - "src/textcharts/percentile_ladder.py"
    - "src/textcharts/normalized_speedup.py"
    - "src/textcharts/bar_chart.py"
    - "src/textcharts/comparison_bar.py"
    - "src/textcharts/__init__.py"
    - "docs/reference/factories.rst"
must_preserve:
  - "All deprecated factory function names continue to work and return identical results"
  - "BenchBox call sites in ascii_runtime.py produce identical output"
  - "__init__.py exports both old and new names"
approach: |
  Create the new function first (just rename the existing one), then make the
  old name a 3-line wrapper: warn + return new(). This is mechanical and safe.
  Do all 12 files in one pass since the pattern is identical.
anti_patterns:
  - "DO NOT remove old function names — because BenchBox uses them — keep as deprecated aliases"
  - "DO NOT change function signatures beyond renaming — because that's a separate concern — only rename"
verification:
  - description: "All existing tests pass via deprecated aliases"
    command: "uv run python -m pytest tests/ -x -q"
    expected_output: "all tests pass"
  - description: "Deprecated aliases emit DeprecationWarning"
    command: "uv run python -m pytest tests/ -k 'deprecated' -v"
    expected_output: "tests pass"
  - description: "New generic names are exported from __init__.py"
    command: "uv run python -c 'from textcharts import ASCIIBarChart; ASCIIBarChart.from_data'"
    expected_output: "no error"
scope_limit:
  only_modify:
    - "src/textcharts/"
    - "tests/"
    - "docs/reference/factories.rst"
