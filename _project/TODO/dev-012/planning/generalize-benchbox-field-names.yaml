id: generalize-benchbox-field-names
title: "Generalize BenchBox-specific field names across all chart types"
worktree: dev-012
priority: High
status: Not Started
category: Core Functionality
description: |
  The MCP server tool schemas and CLI parameters use BenchBox-specific field names
  (e.g., query_id, latency_ms, geo_mean_ms, platforms). When LLMs use these tools
  for non-benchmark data, they're forced into benchmark terminology. Example: creating
  a "commits per day" histogram, the LLM used query_id and latency_ms instead of
  meaningful field names like "date" and "count".

  This is a BREAKING CHANGE to the public API, acceptable at v0.1.2-dev (pre-1.0).

  The CLI is 100% registry-driven (cli.py dynamically generates argparse from
  registry.py), so all registry changes automatically propagate to both MCP tool
  schemas AND CLI --flags. No separate CLI parameter definitions exist.

  Full rename map and implementation details:
  see /Users/joe/.claude/plans/wiggly-splashing-pizza.md

