impact:
  business_value: |
    The textcharts package is a general-purpose visualization tool, not a benchmark tool.
    BenchBox-specific field names confuse LLMs and users, limiting adoption.
  user_impact: |
    LLMs will use meaningful field names when creating charts via MCP. Users will see
    generic defaults like "Value" instead of "Execution Time (ms)" in CLI output.

