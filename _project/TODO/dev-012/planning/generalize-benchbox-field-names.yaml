must_preserve:
  - "All 15 chart types render identical visual output (except histogram x-axis label 'Query ID' removed)"
  - "CLI --help for all commands still works (generated from registry)"
  - "MCP server tool schemas remain valid JSON Schema"
  - "Golden output tests pass after snapshot regeneration"

approach: |
  Use systematic find-and-replace per chart type, working from dataclass -> parser ->
  registry -> tests. The registry is the single source of truth for both CLI and MCP.

  Start with histogram (the reported bug, most impactful). Then summary box (largest
  change). Then rank/sparkline/scatter (smaller). Documentation and tests last.

  For summary box, add new label fields (primary_label, secondary_label, total_label,
  count_label) to replace hardcoded "Geo Mean:", "Median:", "Total:", "Queries:" strings
  in the rendering methods.

anti_patterns:
  - "DO NOT use global text replace across the whole codebase -- because field names like 'value' and 'label' are common words -- do targeted replaces per file instead"
  - "DO NOT try to keep tests passing at intermediate steps -- because the renames are deeply interconnected across registry+parser+dataclass -- update all three together per chart type, then fix tests"
  - "DO NOT rename CLI flag names like --sort-by or --y-label -- because these are already generic -- only change their default values and enum choices"

verification:
  - description: "No old BenchBox field names remain in source"
    command: "rg 'query_id|latency_ms|geo_mean_ms|median_ms|total_time_ms|num_queries|best_queries|worst_queries' src/textcharts/"
    expected_output: "No matches found (exit code 1)"
  - description: "Full test suite passes"
    command: "uv run pytest tests/ -x -q"
    expected_output: "All tests pass, 0 failures"
  - description: "MCP histogram schema uses generic field names"
    command: "uv run python -c \"from textcharts.commands.registry import get_input_schema; import json; print(json.dumps(get_input_schema('histogram'), indent=2))\""
    expected_output: "Schema shows 'label' and 'value' fields, not 'query_id' and 'latency_ms'"
  - description: "CLI histogram renders with generic data"
    command: "echo '[{\"label\": \"Mon\", \"value\": 3}, {\"label\": \"Tue\", \"value\": 6}]' | uv run textcharts histogram --title 'Test' --no-color"
    expected_output: "Renders a histogram with Mon/Tue labels"

